name: Kioskio Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kioskio-main-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Run release lint
        run: ./gradlew --no-daemon lintRelease

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Prepare and verify permanent release key
        env:
          KIOSKIO_SIGNING_PACKAGE: ${{ secrets.KIOSKIO_SIGNING_PACKAGE }}
          EXPECTED_CERT_SHA256: "CA:DB:A6:47:E7:20:74:85:31:58:00:E8:53:2D:FC:DE:C8:33:30:3A:FB:60:11:E1:D6:EF:47:86:98:5A:DD:BB"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KIOSKIO_SIGNING_PACKAGE" || { echo "::error::Missing KIOSKIO_SIGNING_PACKAGE secret"; exit 1; }
          SIGN_DIR="$RUNNER_TEMP/kioskio-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$KIOSKIO_SIGNING_PACKAGE" | base64 --decode > "$SIGN_DIR/signing-package.zip"
          unzip -p "$SIGN_DIR/signing-package.zip" io-tools-release.jks > "$SIGN_DIR/io-tools-release.jks"
          unzip -p "$SIGN_DIR/signing-package.zip" github-secrets.txt > "$SIGN_DIR/github-secrets.txt"
          test -s "$SIGN_DIR/io-tools-release.jks"
          value() { sed -n "s/^$1=//p" "$SIGN_DIR/github-secrets.txt" | head -n 1; }
          KEY_ALIAS="$(value ANDROID_KEY_ALIAS)"
          STORE_PASSWORD="$(value ANDROID_KEYSTORE_PASSWORD)"
          KEY_PASSWORD="$(value ANDROID_KEY_PASSWORD)"
          test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -list -v -keystore "$SIGN_DIR/io-tools-release.jks" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -F "$EXPECTED_CERT_SHA256"
          {
            echo "KIOSKIO_KEYSTORE_PATH=$SIGN_DIR/io-tools-release.jks"
            echo "KIOSKIO_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KIOSKIO_KEY_ALIAS=$KEY_ALIAS"
            echo "KIOSKIO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          rm -f "$SIGN_DIR/signing-package.zip" "$SIGN_DIR/github-secrets.txt"
      - name: Build signed optimized release APK
        env:
          KIOSKIO_KEYSTORE_PATH: ${{ runner.temp }}/kioskio-signing/io-tools-release.jks
          KIOSKIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIOSKIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIOSKIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Report APK sizes
        shell: bash
        run: |
          echo "APK size report"
          find app/build/outputs/apk -type f -name '*.apk' -print0 | while IFS= read -r -d '' file; do
            du -h "$file"
            sha256sum "$file"
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kioskio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kioskio-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
