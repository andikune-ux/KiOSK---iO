name: Kioskio Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kioskio-main-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Run release lint
        run: ./gradlew --no-daemon lintRelease

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Build optimized release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Report APK sizes
        shell: bash
        run: |
          echo "APK size report"
          find app/build/outputs/apk -type f -name '*.apk' -print0 | while IFS= read -r -d '' file; do
            du -h "$file"
            sha256sum "$file"
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kioskio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload optimized release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Kioskio-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
